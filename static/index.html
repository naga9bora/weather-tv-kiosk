function installRadarBase(idx) {
  const map = radarMap;
  if (!map) return;
  if (radarBase) { try { map.removeLayer(radarBase); } catch (e) {} radarBase = null; }
  if (radarLabels) { try { map.removeLayer(radarLabels); } catch (e) {} radarLabels = null; }
  const cfg = RADAR_BASES[idx];
  const baseOpts = { attribution: cfg.attribution, maxZoom: cfg.maxZoom };
  if (cfg.subdomains) baseOpts.subdomains = cfg.subdomains;
  if (cfg.className) baseOpts.className = cfg.className;
  radarBase = L.tileLayer(cfg.base, baseOpts).addTo(map);
  if (cfg.labels) {
    const labelOpts = { maxZoom: cfg.maxZoom, pane: "radarLabels", className: cfg.labelClass || "" };
    if (cfg.subdomains) labelOpts.subdomains = cfg.subdomains;
    radarLabels = L.tileLayer(cfg.labels, labelOpts).addTo(map);
  }
  const providers = $("radarProviders");
  if (providers) providers.innerHTML = cfg.credit + " · RainViewer · Tomorrow.io";
  let ok = 0, err = 0;
  radarBase.on("tileload", function () { ok++; });
  radarBase.on("tileerror", function () {
    err++;
    if (!ok && err >= 3 && idx + 1 < RADAR_BASES.length) installRadarBase(idx + 1);
  });
}

function setRadarTime(tsSec) {
  const el = $("radarUpdated");
  if (!el) return;
  if (!tsSec) { el.textContent = "Dikemas kini —"; return; }
  el.textContent = "Dikemas kini " + new Date(tsSec * 1000).toLocaleTimeString("en-GB", {
    timeZone: TZ, hour: "2-digit", minute: "2-digit"
  }) + " MYT";
}

function ensureRadarMap(region) {
  if (typeof L === "undefined") return null;
  const card = $("radar"), container = $("radarMap");
  if (!card || !container) return null;
  const view = RADAR_VIEW[region] || RADAR_VIEW.my;
  if (!radarMap) {
    radarMap = L.map(container, {
      center: view.center, zoom: view.zoom,
      zoomControl: false, attributionControl: true,
      dragging: false, scrollWheelZoom: false, doubleClickZoom: false,
      boxZoom: false, keyboard: false, tap: false, touchZoom: false
    });
    radarMap.createPane("radarLabels");
    radarMap.getPane("radarLabels").style.zIndex = 450;
    radarMap.getPane("radarLabels").style.pointerEvents = "none";
    installRadarBase(0);
  }
  if (radarRegionCur !== region) {
    radarMap.setView(view.center, view.zoom, { animate: false });
    radarRegionCur = region;
  }
  return radarMap;
}

function showRadarCard(show) {
  const card = $("radar");
  if (!card) return;
  try {
    card.style.display = show ? "flex" : "none";
    document.body.classList.toggle("has-radar", !!show);
  } catch (e) { /* ignore */ }
  if (show && radarMap) {
    setTimeout(function () { try { radarMap.invalidateSize(); } catch (e) {} }, 0);
  }
}

function loadRadar() {
  if (!CONFIG.radar) { showRadarCard(false); return; }
  if (typeof L === "undefined") { showRadarCard(false); return; }
  const region = RADAR_VIEW[CONFIG.radarRegion] ? CONFIG.radarRegion : "my";
  $("radarSrc").textContent = (RADAR_LABEL[region] || "Radar hujan") + " · RainViewer";
  const map = ensureRadarMap(region);
  if (!map) { showRadarCard(false); return; }

  fetch(RADAR_API + "?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function (data) {
      const past = data && data.radar && data.radar.past;
      if (!past || !past.length) throw new Error("no frames");
      const frame = past[past.length - 1];
      const url = "/api/rainviewer/tile?f=" + encodeURIComponent(frame.path) + "&z={z}&x={x}&y={y}";
      if (radarLayer && radarFramePath === frame.path) {
        setRadarTime(frame.time);
        showRadarCard(true);
        return;
      }
      if (radarLayer) { try { map.removeLayer(radarLayer); } catch (e) {} }
      radarLayer = L.tileLayer(url, { tileSize: 256, opacity: 0.72, pane: "overlayPane" });
      radarLayer.on("load", function () { showRadarCard(true); });
      radarLayer.addTo(map);
      radarFramePath = frame.path;
      setRadarTime(frame.time);
      // Show card even if some tiles lag; hide only if we never had anything.
      if (!radarLayer._loaded) { showRadarCard(true); }
      setTimeout(function () { try { map.invalidateSize(); } catch (e) {} }, 50);
    })
    .catch(function (e) {
      try { console.warn("radar load failed", e); } catch (x) {}
      if (!radarLayer) { setRadarTime(0); showRadarCard(false); }
      // keep previous frame visible on transient errors
    });
}

/* =====================================================================
   Location resolution: GPS auto-detect -> ISP -> manual -> fallback district
   ===================================================================== */
async function resolveLocation() {
  // 1. Manual config wins immediately — a TV has no GPS, so trying it first stalls renders for 10s
  if (CONFIG.manual) {
    const m = CONFIG.manual;
    const row = LOCATIONS.find(l => l.id === m.locationId) || null;
    return {
      locationId: m.locationId || (row && row.id),
      name: (row && row.name) || m.label || "Lokasi manual",
      lat: (m.lat != null ? m.lat : (row ? row.lat : null)),
      lon: (m.lon != null ? m.lon : (row ? row.lon : null)),
      region: m.region || null,
      via: m.note || "konfigurasi manual"
    };
  }

  // 2. Reuse a cached last-good location for 30 minutes
  if (lastGood && lastGood.loc && (Date.now() - (lastGood.at || 0) < 30 * 60e3)) {
    return lastGood.loc;
  }

  // 3. Try browser geolocation (low-accuracy cached fix — the TV has no GPS chip)
  if (navigator.geolocation) {
    try {
      const pos = await new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(
          pos => resolve(pos),
          err => reject(err),
          { timeout: 3000, maximumAge: 300000, enableHighAccuracy: false }
        );
      });
      const { latitude, longitude } = pos.coords;
      // Find the nearest forecast district
      const named = matchByName(null); // just use generic match
      const near = nearestLocation(latitude, longitude);
      const pick = (near && haversine(latitude, longitude, near.lat, near.lon) < 50) ? named : (named || near);
      if (pick) {
        return {
          locationId: pick.id,
          name: pick.name,
          lat: latitude,
          longitude,
          via: "GPS auto-detect"
        };
      }
    } catch (e) {
      // fall through to ISP/ manual below - GPS unavailable or denied
    }
  }

  // 3. Try ISP geolocation (ip-api.com -> ipinfo.io)
  let isp = null;
  try {
    const d = await jget("http://ip-api.com/json/?fields=status,city,regionName,lat,lon,isp,query", {}, 8000);
    if (d.status === "success") isp = { lat: d.lat, lon: d.lon, city: d.city, region: d.regionName, isp: d.isp, ip: d.query, src: "ip-api" };
  } catch (e) { /* fall through */ }

  if (!isp) {
    try {
      const d = await jget("https://ipinfo.io/json", {}, 8000);
      const [lat, lon] = String(d.loc || "").split(",").map(Number);
      if (isFinite(lat) && isFinite(lon)) isp = { lat, lon, city: d.city, region: d.region, isp: d.org, ip: d.ip, src: "ipinfo" };
    } catch (e) { /* fall through */ }
  }

  if (!isp) {
    const def = LOCATIONS.find(l => l.id === "Ds054") || LOCATIONS[0];
    return { locationId: def.id, name: def.name, lat: def.lat, lon: def.lon, via: "fallback (ISP lookup failed)" };
  }

  // If the ISP city name is literally one of the forecast districts, trust it.
  const named = matchByName(isp.city);
  const near = nearestLocation(isp.lat, isp.lon);
  const pick = (named && near && haversine(isp.lat, isp.lon, named.lat, named.lon) < 25) ? named : (named || near);

  return {
    locationId: pick.id,
    name: pick.name,
    lat: (isp.lat != null ? isp.lat : pick.lat),
    lon: (isp.lon != null ? isp.lon : pick.lon),
    via: "IP " + isp.ip + " · " + (isp.isp || isp.src),
    ispCity: isp.city,
    region: isp.region,
    approxKm: near ? Math.round(near.distanceKm) : null
  };
}

/* =====================================================================
   Weather fetching
   ===================================================================== */
/* One silent retry: the MET mirror occasionally answers late or with a 5xx for
   a single request. A second attempt 1.5 s later clears almost all of those
   without the caller ever noticing. */
function jgetRetry(url, opts, timeout) {
  return jget(url, opts, timeout).catch(() => new Promise(res => {
    setTimeout(res, 1500);
  }).then(() => jget(url, opts, timeout)));
}

/* Last good MET forecast, kept in memory and localStorage. A failed refresh must
   not blank a populated strip nor turn the whole panel red: the previous copy is
   still ten minutes of useful forecast. Cleared only when it is 6 h old. */
const FC_CACHE_KEY = "metForecastCache";
let fcCache = null;      // { id, at, rows }
let fcStale = false;     // true when this refresh is serving the cached copy

function fcCacheLoad(loc) {
  const ok = c => c && c.id === loc.locationId && c.rows && c.rows.length
    && (Date.now() - c.at) < 6 * 3600e3;
  if (ok(fcCache)) return fcCache;
  try {
    const c = JSON.parse(localStorage.getItem(FC_CACHE_KEY) || "null");
    if (ok(c)) { fcCache = c; return c; }
  } catch (e) { /* corrupt or unavailable storage - ignore */ }
  return null;
}

function fcCacheSave(loc, rows) {
  fcCache = { id: loc.locationId, at: Date.now(), rows };
  try { localStorage.setItem(FC_CACHE_KEY, JSON.stringify(fcCache)); } catch (e) { /* quota */ }
}

async function fetchMetForecast(loc) {
  let rows;
  try {
    if (CONFIG.metToken) {
      // Official api.met.gov.my (requires a token). Structure differs from the mirror.
      const u = `https://api.met.gov.my/v2.1/data?datasetid=FORECAST&datacategoryid=GENERAL&locationid=LOCATION:${encodeURIComponent(loc.locationId)}`;
      const d = await jgetRetry(u, { headers: { Authorization: "METToken " + CONFIG.metToken } });
      rows = (d.results || []).map(r => {
        const v = Object.fromEntries((r.value || []).map(x => [x.name, x.value]));
        return {
          date: r.date, min_temp: +v.mintemp, max_temp: +v.maxtemp,
          morning_forecast: v.morning_forecast, afternoon_forecast: v.afternoon_forecast,
          night_forecast: v.night_forecast, summary_forecast: v.summary_forecast
        };
      });
    } else {
      const u = `https://api.data.gov.my/weather/forecast?filter=${encodeURIComponent(loc.locationId)}@location_id&sort=date&limit=10`;
      const raw = await jgetRetry(u);
      rows = raw.map(r => ({
        date: r.date, min_temp: r.min_temp, max_temp: r.max_temp,
        morning_forecast: r.morning_forecast, afternoon_forecast: r.afternoon_forecast,
        night_forecast: r.night_forecast, summary_forecast: r.summary_forecast
      }));
    }
  } catch (e) {
    const cached = fcCacheLoad(loc);
    if (!cached) throw e;          // nothing to fall back on - report the error
    fcStale = true;
    return cached.rows;
  }
  if (rows.length) { fcCacheSave(loc, rows); fcStale = false; }
  else { fcStale = false; }
  return rows;
}

/* ---- current conditions -------------------------------------------------
   Preference order:
     1. a real METAR observation from the nearest MET airport station
        (Subang WMSA, or KLIA WMKK) - this is what "no rain here" looks like;
     2. otherwise an Open-Meteo model estimate, clearly labelled as such.

   A single model blend is unreliable in convective weather: on 2026-10-30 the
   default blend claimed 0.7 mm of showers over Kuala Lumpur while Subang was
   reporting 33 C, 10 km visibility and no rain at all.
   ---------------------------------------------------------------------- */
const METAR_STATIONS = [
  { id: "WMSA", name: "Subang", lat: 3.1306, lon: 101.5493 },
  { id: "WMKK", name: "KLIA",   lat: 2.7456, lon: 101.7099 }
];

const WX_TOKEN = /^[-+]?(VC)?(TS|SH|RA|DZ|GR|GS|SN|BR|HZ|FG|FU|DU|SA|SQ|PO|FC|SS|DS|PL|IC|UP)+$/;
const CLOUD_LABEL = { FEW: "Sedikit", SCT: "Tersebar", BKN: "Pecah", OVC: "Mendung" };

function metarTime(dd, hh, mm) {
  const now = new Date();
  let t = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), dd, hh, mm);
  if (t - now.getTime() > 36 * 3600e3) {   // report from the previous month
    t = Date.UTC(now.getUTCFullYear(), now.getUTCMonth() - 1, dd, hh, mm);
  }
  return t;
}

function parseMetars(text) {
  const out = {};
  String(text || "").split(/\r?\n/).forEach(line => {
    const m = String(line).trim().match(/^(?:METAR\s+|SPECI\s+)?([A-Z]{4})\s+(\d{2})(\d{2})(\d{2})Z\s+(.+)$/);
    if (!m) return;
    const body = m[5];
    const td = body.match(/\s(M?\d{2})\/(M?\d{2})\s/);
    if (!td) return;
    const num = s => (s.charAt(0) === "M" ? -parseInt(s.slice(1), 10) : parseInt(s, 10));
    const wind = body.match(/\b(\d{3}|VRB)(\d{2,3})(?:G(\d{2,3}))?KT\b/);
    const cloud = body.match(/\b(FEW|SCT|BKN|OVC)(\d{3})(CB|TCU)?/);
    out[m[1]] = {
      id: m[1],
      time: metarTime(+m[2], +m[3], +m[4]),
      temp: num(td[1]),
      dew: num(td[2]),
      windKt: wind ? +wind[2] : null,
      windDir: wind ? (wind[1] === "VRB" ? null : +wind[1]) : null,
      gustKt: wind && wind[3] ? +wind[3] : null,
      wx: body.split(/\s+/).filter(t => WX_TOKEN.test(t)),
      clouds: cloud ? cloud[1] : "",
      cloudFt: cloud ? +cloud[2] * 100 : null,
      cavok: /\bCAVOK\b/.test(body)
    };
  });
  return out;
}

async function fetchObservation(loc) {
  if (loc.lat == null || loc.lon == null) return null;
  const near = METAR_STATIONS
    .map(s => ({ ...s, km: haversine(loc.lat, loc.lon, s.lat, s.lon) }))
    .sort((a, b) => a.km - b.km);
  const r = await fetch("/api/metar?ids=" + near.map(s => s.id).join(","),
                        { cache: "no-store" });
  if (!r.ok) throw new Error("METAR HTTP " + r.status);
  const obs = parseMetars(await r.text());
  for (const s of near) {
    const o = obs[s.id];
    if (!o) continue;
    if ((Date.now() - o.time) / 60000 > 150) continue;   // stale report
    return { ...o, station: s.name, km: Math.round(s.km) };
  }
  return null;
}

function clockHM(t) {
  return new Date(t).toLocaleTimeString("en-GB", {
    timeZone: TZ, hour: "2-digit", minute: "2-digit"
  });
}

function humidityFromDew(t, td) {
  const es = 6.112 * Math.exp(17.67 * t / (t + 243.5));
  const e = 6.112 * Math.exp(17.67 * td / (td + 243.5));
  return Math.max(1, Math.min(100, Math.round(100 * e / es)));
}

/* Steadman apparent temperature (the "feels like" used by BoM). */
function apparentTemp(t, rh, windMs) {
  const e = (rh / 100) * 6.112 * Math.exp(17.67 * t / (t + 243.5));
  return t + 0.33 * e - 0.7 * windMs - 4;
}

function describeMetar(o, isDay) {
  const s = o.wx.join(" ");
  let icon, en;
  if (/TS|SQ|FC/.test(s))             { icon = "storm";  en = "Ribut petir"; }
  else if (/SH/.test(s))              { icon = "rain";   en = /VC/.test(s) ? "Hujan berhampiran" : "Hujan"; }
  else if (/RA|DZ|GR|GS|PL/.test(s))  { icon = "rain";   en = /\+/.test(s) ? "Hujan lebat" : (/-/.test(s) ? "Hujan ringan" : "Hujan"); }
  else if (/FG/.test(s))              { icon = "haze";   en = "Kabut"; }
  else if (/HZ|FU|DU|SA/.test(s))     { icon = "haze";   en = "Jerebu"; }
  else if (/BR/.test(s))              { icon = "haze";   en = "Kabus"; }
  else if (/OVC|BKN/.test(o.clouds))  { icon = "cloudy"; en = "Berawan"; }
  else if (/SCT|FEW/.test(o.clouds))  { icon = "partly"; en = "Sebahagian berawan"; }
  else                                 { icon = "clear";  en = "Cerah"; }
  if (!isDay && (icon === "clear" || icon === "partly")) icon = "night";
  return { icon: icon, en: en };
}

async function fetchNowcast(loc) {
  if (loc.lat == null || loc.lon == null) return null;
  const d = await jget(`/api/nowcast?lat=${loc.lat}&lon=${loc.lon}`, {}, 12000);
  const tl = (d && d.timelines && d.timelines.minutely) || [];
  if (!tl.length) return null;
  const rain = tl.map(e => +((e.values && e.values.rainIntensity) || 0));
  const prob = tl.map(e => +((e.values && e.values.precipitationProbability) || 0));
  return { rain: rain, prob: prob, at: tl[0] && tl[0].time, n: tl.length };
}

/* One-line rain outlook on the radar card, from Tomorrow.io's 1-minute steps.
 * Radar shows where rain is; this says when it reaches the kiosk. Uses rain
 * intensity first (probability alone runs high in the tropics). */
let nowcastAt = 0;
function renderNowcast(nc) {
  const el = $("radarNow");
  if (!el) return;
  /* A failed refresh (e.g. the free tier's 25 calls/hour) must not blank the
     line: keep the last outlook and let the housekeeping timer drop it once it
     is 20 min old. */
  if (!nc || !nc.rain || !nc.rain.length) return;
  nowcastAt = Date.now();
  const rain = nc.rain, prob = nc.prob;
  /* 0.1 mm/h is barely a drizzle, and Tomorrow's own probability is often 5%
     for those steps — announcing "hujan ±54 min" for that reads as broken. */
  const wet = i => rain[i] >= 0.25 || (rain[i] >= 0.1 && prob[i] >= 50);
  if (wet(0)) {
    let n = 0;
    while (n < rain.length && wet(n)) n++;
    el.textContent = n >= rain.length ? "hujan berterusan" : "berhenti ±" + n + " min";
    return;
  }
  let k = -1;
  for (let i = 1; i < rain.length; i++) if (wet(i)) { k = i; break; }
  el.textContent = k < 1 ? "tiada hujan 60 min" : "hujan ±" + k + " min lagi";
}

async function fetchCurrent(loc) {
  if (loc.lat == null || loc.lon == null) return null;
  const u = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}`
    + `&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,`
    + `wind_speed_10m,wind_direction_10m,is_day,surface_pressure`
    + `&hourly=cloud_cover,precipitation,precipitation_probability,weathercode,temperature_2m`
    + `&daily=sunrise,sunset,precipitation_probability_max,uv_index_max,weather_code,temperature_2m_max,temperature_2m_min`
    + `&timezone=${encodeURIComponent(TZ)}&forecast_days=7`;
  const d = await jget(u);
  return { current: d.current, daily: d.daily, hourly: d.hourly };
}

function popNextHours(hourly, nowIso, hours) {
  try {
    let key;
    if (nowIso) {
      key = String(nowIso).slice(0, 13) + ":00";            // "2026-11-17T10:00"
    } else {
      const hh = new Date().toLocaleTimeString("en-GB", { timeZone: TZ, hour: "2-digit", hour12: false });
      key = ymdTZ(Date.now()) + "T" + hh.slice(0, 2) + ":00";
    }
    const i = hourly.time.indexOf(key);
    if (i < 0) return null;
    let m = 0, seen = false;
    for (let k = i; k < Math.min(hourly.time.length, i + hours); k++) {
      const v = hourly.precipitation_probability ? hourly.precipitation_probability[k] : null;
      if (v != null) { seen = true; if (v > m) m = v; }
    }
    return seen ? m : null;
  } catch (e) { return null; }
}

/* OpenWeatherMap current conditions - more local than Subang METAR */
const OWM_TO_ICON = {
  200: "storm", 201: "storm", 202: "storm", 210: "storm", 211: "storm", 212: "storm", 221: "storm", 230: "storm", 231: "storm", 232: "storm",
  300: "rain", 301: "rain", 302: "rain", 310: "rain", 311: "rain", 312: "rain", 313: "rain", 314: "rain", 321: "rain",
  500: "rain", 501: "rain", 502: "rain", 503: "rain", 504: "rain", 511: "rain", 520: "rain", 521: "rain", 522: "rain", 531: "rain",
  600: "rain", 601: "rain", 602: "rain", 611: "rain", 612: "rain", 613: "rain", 615: "rain", 616: "rain", 620: "rain", 621: "rain", 622: "rain",
  701: "haze", 711: "haze", 721: "haze", 731: "haze", 741: "haze", 751: "haze", 761: "haze", 762: "haze", 771: "haze", 781: "storm",
  800: "clear",
  801: "partly", 802: "partly", 803: "cloudy", 804: "cloudy"
};

async function fetchOpenWeatherMap(loc) {
  if (loc.lat == null || loc.lon == null) return null;
  // Proxied by the shell (/api/owm/current): the API key stays out of the page.
  const u = `/api/owm/current?lat=${loc.lat}&lon=${loc.lon}`;
  const d = await jget(u);
  const w = d.weather[0];
  let icon = OWM_TO_ICON[w.id] || "cloudy";
  if (/n$/.test(w.icon || "") && (icon === "clear" || icon === "partly")) icon = "night";
  return {
    temp: d.main.temp,
    feelsLike: d.main.feels_like,
    humidity: d.main.humidity,
    pressure: d.main.pressure,
    windSpeed: d.wind.speed,
    windDeg: d.wind.deg,
    clouds: d.clouds.all,
    weatherCode: w.id,
    weatherMain: w.main,
    weatherDesc: w.description ? w.description.charAt(0).toUpperCase() + w.description.slice(1) : "",
    icon: icon,
    sunrise: d.sys.sunrise,
    sunset: d.sys.sunset,
    obsTime: d.dt * 1000
  };
}

/* OpenWeatherMap 5-day/3-hour forecast — used when the model selector prefers OWM */
async function fetchOwmForecast(loc) {
  if (loc.lat == null || loc.lon == null) return null;
  const u = `/api/owm/forecast?lat=${loc.lat}&lon=${loc.lon}`;
  const d = await jget(u);
  return (d.list || []).map(e => ({
    dt: e.dt * 1000,
    date: new Date(e.dt * 1000).toLocaleDateString("en-CA", { timeZone: TZ }),
    temp: e.main ? e.main.temp : null,
    tmin: e.main ? e.main.temp_min : null,
    tmax: e.main ? e.main.temp_max : null,
    code: e.weather && e.weather[0] ? e.weather[0].id : 0,
    main: e.weather && e.weather[0] ? e.weather[0].main : "",
    desc: e.weather && e.weather[0] ? e.weather[0].description : "",
    cloud: e.clouds ? e.clouds.all : 0,
    pop: e.pop != null ? Math.round(e.pop * 100) : 0,
    rain: e.rain && e.rain["3h"] != null ? e.rain["3h"] : null
  }));
}

/* OWM weather id -> {icon, en} for forecast entries */
function describeOwm(id) {
  const n = Number(id) || 0, g = Math.floor(n / 100);
  if (n === 800) return { icon: "clear", en: "Cerah" };
  if (n === 801 || n === 802) return { icon: "partly", en: "Sebahagian berawan" };
  if (n >= 803) return { icon: "cloudy", en: "Awan pecah" };
  if (g === 2) return { icon: "storm", en: "Ribut petir" };
  if (g === 3 || g === 5) return { icon: "rain", en: "Hujan" };
  if (g === 6) return { icon: "rain", en: "Salji" };
  if (g === 7) return { icon: "haze", en: "Jerebu" };
  return { icon: "cloudy", en: "Berawan" };
}

const dotIcon = icon => ({ storm: "#ffd166", rain: "#5eb0ff", haze: "#c9b48f", cloudy: "#9aa6bf", clear: "transparent", partly: "transparent", night: "#9aa6bf" }[icon] || "#9aa6bf");
function dayDots(icon) {
  const d = icon || "cloudy";
  const row = (label, x) => '<div class="prow"><span class="pl">' + label + '</span><span class="pdot" style="background:' + dotIcon(x) + '"></span></div>';
  return row("Pagi", d) + row("Ptg", d) + row("Mlm", d);
}

function renderOmDaily(daily) {
  const times = (daily && daily.time) || [];
  if (!times.length) { $("days").innerHTML = ""; return; }
  const today = new Date().toLocaleDateString("en-CA", { timeZone: TZ });
  const codes = (daily && daily.weather_code) || [];
  const tmax = (daily && daily.temperature_2m_max) || [], tmin = (daily && daily.temperature_2m_min) || [];
  $("days").innerHTML = times.slice(0, 7).map((t, i) => {
    const dt = new Date(t + "T12:00:00");
    const isToday = t === today;
    const dow = isToday ? "Hari ini" : DAY_SHORT[dt.getDay()];
    const dnum = pad(dt.getDate()) + " " + MONTH_SHORT[dt.getMonth()];
    const w = describeWmo((codes[i] != null ? codes[i] : 0), true);
    const icon = w.icon;
    return '<div class="day' + (isToday ? " today" : "") + '">'
      + '<div class="dow">' + dow + '</div><div class="dnum">' + dnum + '</div>'
      + '<div class="icon">' + (SVG[icon] || SVG.cloudy) + '</div>'
      + '<div class="tmax">' + (tmax[i] != null ? Math.round(tmax[i]) + "°" : "—") + '</div>'
      + '<div class="tmin">' + (tmin[i] != null ? Math.round(tmin[i]) + "°" : "—") + '</div>'
      + '<div class="periods">' + dayDots(icon) + '</div>'
      + '</div>';
  }).join("");
}

function renderOwmDaily(list) {
  const byDate = {};
  for (const e of (list || [])) { const k = e.date; (byDate[k] = byDate[k] || []).push(e); }
  const dates = Object.keys(byDate).sort().slice(0, 5);
  if (!dates.length) { $("days").innerHTML = ""; return; }
  const today = new Date().toLocaleDateString("en-CA", { timeZone: TZ });
  $("days").innerHTML = dates.map(date => {
    const entries = byDate[date];
    const tmaxVals = [], tminVals = [], freq = {};
    for (const e of entries) {
      if (e.tmax != null) tmaxVals.push(e.tmax);
      if (e.tmin != null) tminVals.push(e.tmin);
      freq[e.code] = (freq[e.code] || 0) + 1;
    }
    const tmax = tmaxVals.length ? Math.max.apply(null, tmaxVals) : null;
    const tmin = tminVals.length ? Math.min.apply(null, tminVals) : null;
    const top = Object.keys(freq).sort((a, b) => freq[b] - freq[a])[0];
    const w = describeOwm(top != null ? Number(top) : 0);
    const icon = w.icon;
    const dt = new Date(date + "T12:00:00");
    const isToday = date === today;
    const dow = isToday ? "Hari ini" : DAY_SHORT[dt.getDay()];
    const dnum = pad(dt.getDate()) + " " + MONTH_SHORT[dt.getMonth()];
    return '<div class="day' + (isToday ? " today" : "") + '">'
      + '<div class="dow">' + dow + '</div><div class="dnum">' + dnum + '</div>'
      + '<div class="icon">' + (SVG[icon] || SVG.cloudy) + '</div>'
      + '<div class="tmax">' + (tmax != null ? Math.round(tmax) + "°" : "—") + '</div>'
      + '<div class="tmin">' + (tmin != null ? Math.round(tmin) + "°" : "—") + '</div>'
      + '<div class="periods">' + dayDots(icon) + '</div>'
      + '</div>';
  }).join("");
}

function renderOwmHourly(list) {
  const now = Date.now();
  const upcoming = (list || []).filter(e => e.dt >= now - 1800e3).slice(0, 5);
  if (!upcoming.length) { $("hourly").innerHTML = ""; return; }
  let html = '<div class="hourlyHeader"><h2>Ramalan 3 jam</h2><span class="sub">setiap 3 jam · OpenWeatherMap</span></div><div class="hourlyGrid">';
  for (const e of upcoming) {
    const h = new Date(e.dt);
    const hour24 = h.getHours();
    const hour12 = hour24 % 12 || 12;
    const ampm = hour24 < 12 ? "PG" : "PTG";
    const w = describeOwm(e.code);
    const rainTxt = e.rain != null ? e.rain.toFixed(1) + "mm" : (e.pop ? e.pop + "%" : "—");
    const rainCls = e.rain != null ? "" : " dry";
    const cloud = e.cloud == null ? 0 : e.cloud;
    const nextHour = (new Date().getHours() + 1) % 24;
    const active = hour24 === nextHour ? " active" : "";
    html += '<div class="hourlyItem' + active + '">'
      + '<div class="hourTime"><span class="hh">' + hour12 + '</span><span class="ap">' + ampm + '</span></div>'
      + '<div class="hourIcon">' + (SVG[w.icon] || SVG.cloudy) + '</div>'
      + '<div class="hourTemp">' + (e.temp != null ? Math.round(e.temp) : "—") + '°</div>'
      + '<div class="hourDesc">' + escapeHtml(w.en) + '</div>'
      + '<div class="hourRain' + rainCls + '">' + rainTxt + '</div>'
      + '<div class="hourCloudBar"><div class="hourCloudFill" style="width:' + Math.max(0, Math.min(100, cloud)) + '%"></div></div>'
      + '</div>';
  }
  $("hourly").innerHTML = html + '</div>';
}

function pickWarnings(list, region) {
  const cutoff = Date.now() - CONFIG.warnWindowHours * 3600e3;
  const r = norm(region);
  return (list || []).filter(w => {
    const issued = Date.parse((w.warning_issue && w.warning_issue.issued) || "");
    if (isFinite(issued) && issued < cutoff) return false;
    if (!r) return true;
    const hay = norm([w.heading_en, w.text_en, w.heading_bm, w.text_bm].join(" "));
    return hay.includes(r) || hay.includes("all states") || hay.includes("peninsular malaysia");
  });
}

/* =====================================================================
   Rendering
   ===================================================================== */
function setIcon(el, name) { el.innerHTML = SVG[name] || SVG.cloudy; }

function currentModel() {
  try { return (localStorage && localStorage.getItem("weatherModel")) || CONFIG.preferredModel || "auto"; } catch (e) { return CONFIG.preferredModel || "auto"; }
}
const MODEL_ORDER = ["auto", "openmeteo", "openweathermap", "metar"];
const MODEL_LABEL = { auto: "auto", openmeteo: "open-meteo", openweathermap: "openweathermap", metar: "metar" };

function renderNow(loc, cur, owm, obs, omFallback) {
  $("placeName").textContent = loc.name;

  /* Fallback chain: Open-Meteo (1st) -> OpenWeatherMap (2nd) -> METAR Subang (3rd) */
  const sourceLabel = cur ? "Open-Meteo" : (owm ? "OpenWeatherMap" : (obs ? obs.station + " · cerapan" : ""));
  const sourceKm = obs && !cur && !owm ? obs.km : null;
  const modelBtn = '<button type="button" class="badge model-btn" id="modelBadge" title="Sumber model cuaca — tekan untuk tukar">model: ' + escapeHtml(MODEL_LABEL[currentModel()] || "auto") + '</button>';
  const placeMetaParts = [
    escapeHtml(loc.via),
    sourceKm != null ? `${sourceLabel} · ${sourceKm} km` : sourceLabel,
    modelBtn,
    `<span class="badge">${escapeHtml(loc.locationId || "")}</span>`
  ].filter(Boolean);
  $("placeMeta").innerHTML = placeMetaParts.join(' <span class="metaSep">·</span> ');

  const d = (cur && cur.daily) || (omFallback && omFallback.daily) || {};
  const sunrise = d.sunrise && d.sunrise[0] ? d.sunrise[0].slice(11, 16) : "—";
  const sunset = d.sunset && d.sunset[0] ? d.sunset[0].slice(11, 16) : "—";
  const uv = d.uv_index_max ? d.uv_index_max[0] : null;
  /* "Peluang hujan" is the next 3 hours, not the whole day: on a dry morning the
     24-hour maximum (e.g. 100%) reads as if it were raining now. */
  const pop3 = cur && cur.hourly ? popNextHours(cur.hourly, cur.current.time, 3)
    : (omFallback && omFallback.hourly ? popNextHours(omFallback.hourly, null, 3) : null);
  const pop = pop3 != null ? pop3 : (d.precipitation_probability_max ? d.precipitation_probability_max[0] : null);

  /* ---- Priority 1: Open-Meteo model at exact coordinates ---- */
  if (cur) {
    const c = cur.current;
    const { icon, en } = describeWmo(c.weather_code, c.is_day === 1);
    setIcon($("nowIcon"), icon);
    $("nowTemp").innerHTML = `${Math.round(c.temperature_2m)}<sup>°C</sup>`;
    $("nowCond").innerHTML = `${escapeHtml(en)}<small>Feels like ${Math.round(c.apparent_temperature)}°C · model estimate · Open-Meteo</small>`;

    const rainChance = pop != null ? `${pop}<span>%</span>` : "—";
    const stats = [
      ["Kelembapan", `${c.relative_humidity_2m}<span>%</span>`],
      ["Angin", `${Math.round(c.wind_speed_10m)}<span> km/j ${compass(c.wind_direction_10m)}</span>`],
      ["Hujan sekarang", `${(c.precipitation == null ? 0 : c.precipitation).toFixed(1)}<span> mm</span>`],
      ["Peluang hujan 3 j", rainChance],
      ["UV maks", uv != null ? `${Math.round(uv)}<span> daripada 11</span>` : "—"],
      ["Matahari", `<span>${sunrise} – ${sunset}</span>`]
    ];
    $("nowStats").innerHTML = stats.map(([k, v]) =>
      `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
    return;
  }

  /* ---- Priority 2: OpenWeatherMap at exact coordinates ---- */
  if (owm) {
    const owmLabel = describeOwm(owm.weatherCode).en;
    setIcon($("nowIcon"), owm.icon);
    $("nowTemp").innerHTML = `${Math.round(owm.temp)}<sup>°C</sup>`;
    $("nowCond").innerHTML = `${escapeHtml(owmLabel)}<small>Feels like ${Math.round(owm.feelsLike)}°C · OpenWeatherMap · ${escapeHtml(owm.weatherDesc)}</small>`;

    const windKmh = Math.round(owm.windSpeed * 3.6);
    const windTxt = owm.windSpeed == 0 ? `<span>tenang</span>`
      : `${windKmh}<span> km/j ${compass(owm.windDeg)}</span>`;

    const cloudLabel = owm.clouds <= 10 ? "Cerah" : owm.clouds <= 25 ? "Separa" : owm.clouds <= 50 ? "Berawan" : "Mendung";
    const cloudTxt = `${cloudLabel} ${owm.clouds}%`;

    const rainChance = pop != null ? `${pop}<span>%</span>` : "—";
    const stats = [
      ["Kelembapan", `${owm.humidity}<span>%</span>`],
      ["Angin", windTxt],
      ["UV maks", uv != null ? `${Math.round(uv)}<span> daripada 11</span>` : "—"],
      ["Awan", `<span>${cloudTxt}</span>`],
      ["Peluang hujan 3 j", rainChance],
      ["Matahari", `<span>${sunrise} – ${sunset}</span>`]
    ];
    $("nowStats").innerHTML = stats.map(([k, v]) =>
      `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
    return;
  }

  /* ---- Priority 3: METAR observation at Subang (18 km away) ---- */
  if (obs) {
    const obsRain = obs ? /(RA|SH|DZ|GR|GS|PL)/.test(obs.wx.join(" ")) : null;
    const hour = Number(new Date(obs.time).toLocaleString("en-GB", {
      timeZone: TZ, hour: "2-digit", hour12: false
    }));
    const isDay = hour >= 7 && hour < 19;
    const meta = describeMetar(obs, isDay);
    const rh = humidityFromDew(obs.temp, obs.dew);
    const feels = Math.round(apparentTemp(obs.temp, rh, (obs.windKt || 0) * 0.514444));

    setIcon($("nowIcon"), meta.icon);
    $("nowTemp").innerHTML = `${obs.temp}<sup>°C</sup>`;
    $("nowCond").innerHTML = `${escapeHtml(meta.en)}<small>Feels like ${feels}°C · dicerap ${clockHM(obs.time)} di ${escapeHtml(obs.station)}</small>`;

    const kmh = obs.windKt == null ? null : Math.round(obs.windKt * 1.852);
    const windTxt = kmh == null ? "—"
      : (obs.windKt === 0 ? `<span>tenang</span>`
        : `${kmh}<span> km/j ${obs.windDir == null ? "berubah" : compass(obs.windDir)}</span>`
          + (obs.gustKt ? ` <span>G${Math.round(obs.gustKt * 1.852)}</span>` : ""));

    const cloudTxt = obs.clouds
      ? `${CLOUD_LABEL[obs.clouds]} awan${obs.cloudFt ? " " + (obs.cloudFt / 1000).toFixed(1) + "k kaki" : ""}`
      : (obs.cavok ? "Cerah" : "—");

    const rainChance = obsRain ? "0%" : (pop != null ? `${pop}<span>%</span>` : "—");
    const stats = [
      ["Kelembapan", `${rh}<span>%</span>`],
      ["Angin", windTxt],
      ["Titik embun", `${obs.dew}<span>°C</span>`],
      ["Awan", `<span>${cloudTxt}</span>`],
      ["Peluang hujan 3 j", rainChance],
      ["Matahari", `<span>${sunrise} – ${sunset}</span>`]
    ];
    $("nowStats").innerHTML = stats.map(([k, v]) =>
      `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
    return;
  }

  /* ---- No data available ---- */
  $("nowTemp").innerHTML = "--<sup>°C</sup>";
  $("nowCond").textContent = "Data langsung tiada";
  $("nowStats").innerHTML = "";
  setIcon($("nowIcon"), "cloudy");
}
function renderForecast(rows) {
  const today = new Date().toLocaleDateString("en-CA", { timeZone: TZ }); // YYYY-MM-DD
  const sorted = rows.slice().sort((a, b) => a.date.localeCompare(b.date)).slice(0, 7);
  $("days").innerHTML = sorted.map(r => {
    const dt = new Date(r.date + "T12:00:00");
    const isToday = r.date === today;
    const dow = isToday ? "Hari ini" : DAY_SHORT[dt.getDay()];
    const dnum = pad(dt.getDate()) + " " + MONTH_SHORT[dt.getMonth()];
    const m = describeBm(r.morning_forecast), a = describeBm(r.afternoon_forecast), n = describeBm(r.night_forecast);
    const icon = worst([m.icon, a.icon, n.icon]);
    const dot = { storm: "#ffd166", rain: "#5eb0ff", haze: "#c9b48f", cloudy: "#9aa6bf", clear: "transparent", partly: "transparent", night: "#9aa6bf" };
    const row = (label, x) => `<div class="prow"><span class="pl">${label}</span><span class="pdot" style="background:${dot[x.icon]}"></span></div>`;
    return `<div class="day ${isToday ? "today" : ""}" title="${escapeHtml(r.summary_forecast || "")}">
      <div class="dow">${dow}</div><div class="dnum">${dnum}</div>
      <div class="icon">${SVG[icon]}</div>
      <div class="tmax">${r.max_temp != null ? r.max_temp + "°" : "—"}</div>
      <div class="tmin">${r.min_temp != null ? r.min_temp + "°" : "—"}</div>
      <div class="periods">${row("Pagi", m)}${row("Ptg", a)}${row("Mlm", n)}</div>
    </div>`;
  }).join("");
}

function renderHourlyForecast(hourly) {
  if (!hourly || !hourly.time) {
    $("hourly").innerHTML = "";
    return;
  }
  const now = new Date();
  const ymd = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
  const hourPrefix = ymd + "T" + String(now.getHours()).padStart(2, "0") + ":00:00";
  const startIdx = hourly.time.findIndex(t => t >= hourPrefix);
  const showIdx = startIdx >= 0 ? startIdx : 0;
  const endIdx = Math.min(showIdx + 12, hourly.time.length);
  const hours = hourly.time.slice(showIdx, endIdx);
  const clouds = hourly.cloud_cover ? hourly.cloud_cover.slice(showIdx, endIdx) : [];
  const precipitation = hourly.precipitation ? hourly.precipitation.slice(showIdx, endIdx) : [];
  const weathercodes = hourly.weathercode ? hourly.weathercode.slice(showIdx, endIdx) : [];
  const temperatures = hourly.temperature_2m ? hourly.temperature_2m.slice(showIdx, endIdx) : [];
  const desc = {
    0: "Cerah", 1: "Cerah", 2: "Separa", 3: "Berawan",
    45: "Kabut", 48: "Kabut",
    51: "Gerimis", 53: "Gerimis", 55: "Gerimis", 56: "Gerimis", 57: "Gerimis",
    61: "Hujan", 63: "Hujan", 65: "Hujan", 66: "Hujan", 67: "Hujan",
    71: "Salji", 73: "Salji", 75: "Salji", 77: "Salji",
    80: "Hujan", 81: "Hujan", 82: "Hujan",
    85: "Salji", 86: "Salji",
    95: "Ribut", 96: "Ribut", 99: "Ribut"
  };
  const wmoToIcon = {
    0: "clear", 1: "clear", 2: "partly", 3: "cloudy",
    45: "haze", 48: "haze",
    51: "rain", 53: "rain", 55: "rain", 56: "rain", 57: "rain",
    61: "rain", 63: "rain", 65: "rain", 66: "rain", 67: "rain",
    71: "rain", 73: "rain", 75: "rain", 77: "rain",
    80: "rain", 81: "rain", 82: "rain",
    85: "rain", 86: "rain",
    95: "storm", 96: "storm", 99: "storm"
  };
  let html = `<div class="hourlyHeader"><h2>12 Jam Seterusnya</h2></div><div class="hourlyGrid">`;
  for (let i = 0; i < hours.length; i++) {
    const h = new Date(hours[i]);
    const hour24 = h.getHours();
    const hour12 = hour24 % 12 || 12;
    const ampm = hour24 < 12 ? "PG" : "PTG";
    const temp = temperatures[i] !== undefined ? Math.round(temperatures[i]) : "—";
    const cloudPct = clouds[i] !== undefined ? clouds[i] : 0;
    const rainmm = precipitation[i] !== undefined ? precipitation[i].toFixed(1) : "0";
    const wcode = weathercodes[i] || 0;
    const iconKey = wmoToIcon[wcode] || "cloudy";
    const hIcon = SVG[iconKey] || SVG.cloudy;
    const hDesc = desc[wcode] || "—";
    const hRain = parseFloat(rainmm) > 0 ? `${rainmm}mm` : "—";
    const hRainDry = !(parseFloat(rainmm) > 0);
    const currentHour = now.getHours();
const nextHour = (currentHour + 1) % 24;
const isActive = hour24 === nextHour;
    html += `<div class="hourlyItem${isActive ? " active" : ""}">
      <div class="hourTime"><span class="hh">${hour12}</span><span class="ap">${ampm}</span></div>
      <div class="hourIcon">${hIcon}</div>
      <div class="hourTemp">${temp}°</div>
      <div class="hourDesc">${hDesc}</div>
      <div class="hourRain${hRainDry ? " dry" : ""}">${hRain}</div>
      <div class="hourCloudBar"><div class="hourCloudFill" style="width:${Math.max(0, Math.min(100, cloudPct))}%"></div></div>
    </div>`;
  }
  html += `</div>`;
  $("hourly").innerHTML = html;
}

function renderWarnings(list) {
  if (!list.length) { $("warn").classList.remove("show"); return; }
  const w = list[0];
  const title = w.heading_bm || w.heading_en || (w.warning_issue && (w.warning_issue.title_bm || w.warning_issue.title_en)) || "Amaran cuaca";
  const until = w.valid_to ? new Date(w.valid_to).toLocaleString("en-GB", { timeZone: TZ, day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
  let extra = "";
  if (w.valid_to) {
    const abs = Math.max(0, Date.parse(w.valid_to) - Date.now());
    const rh = Math.floor(abs / 3600000);
    const rm = Math.floor((abs % 3600000) / 60000);
    extra = " — berakhir dalam " + (rh > 0 ? rh + " jam " : "") + rm + " min";
  }
  $("warnTxt").textContent = title + (until ? ` — sah sehingga ${until}` : "") + extra;
  $("warn").classList.add("show");
}

const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* Debug beacon: open the page with #beacon and it reports what it rendered to
   the local dev server log. Harmless when the server is not running. */
function beacon(payload) {
  if (!/beacon/.test(location.hash + location.search)) return;
  try {
    fetch("http://127.0.0.1:8080/beacon?d=" + encodeURIComponent(JSON.stringify(payload)), { mode: "no-cors" });
  } catch (e) { /* ignore */ }
}

/* Clock */
function setVh() {
  document.documentElement.style.setProperty("--vh", window.innerHeight + "px");
  // Detect resolution and set CSS vars
  setResolution();
}

function setResolution() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  // Detect resolution class for adaptive layout
  if (w >= 1280 && h >= 720) {
    // HD (1280x720) and above - default layout
    document.documentElement.className = "resolution-hd";
  } else if (w >= 800 && h >= 480) {
    // FWVGA and above - scaled layout
    document.documentElement.className = "resolution-sd";
  } else {
    // Small screens - simplified layout
    document.documentElement.className = "resolution-small";
  }
}

function tickClock() {
  const now = new Date();
  $("clock").textContent = now.toLocaleTimeString("en-GB", {
    timeZone: TZ, hour: "2-digit", minute: "2-digit",
    second: CONFIG.showSeconds ? "2-digit" : undefined
  });
  const d = dateFromYmd(ymdTZ(now));
  $("today").textContent = DAY_LONG[d.getDay()] + ", " + d.getDate() + " " + MONTH_LONG[d.getMonth()] + " " + d.getFullYear();
}

/* =====================================================================
   Main loop
   ===================================================================== */
let lastGood = null;

async function refresh() {
  beacon({ stage: "start" });
  const errors = [];
  // Always resolve location fresh - don't rely on cached lastGood location
  let loc = null;
  try {
    loc = await resolveLocation();
  } catch (e) { errors.push("location: " + e.message); }

  if (!loc) {
    $("bootMsg").innerHTML = `<div class="err">Tidak dapat menentukan lokasi.<br>Tetapkan CONFIG.manual dalam index.html.</div>`;
    return;
  }

  let om = null, obs = null, owm = null, owmFc = null, rows = [], warns = [], nowc = null;
  const cached = [];   // sources this cycle had to serve from the last-good cache

  /* Rain radar: MET Malaysia CAPPI image via the native same-origin proxy.
     Reloaded on the same cycle as the weather, which matches MET's 10-minute
     publication cadence. */
  if (CONFIG.radar) {
    loadRadar();
  } else {
    const r = $("radar");
    if (r) r.style.display = "none";
    document.body.classList.remove("has-radar");
  }
  // Resolve preferred model (config default overridden by localStorage)
  const preferredModel = currentModel();
  const useOm = preferredModel === "auto" || preferredModel === "openmeteo";
  const wantOwm = preferredModel === "auto" || preferredModel === "openweathermap";
  const wantObs = preferredModel === "auto" || preferredModel === "metar";
  const fetchTasks = [];
  // Always fetch Open-Meteo: drives the 12-hour strip and supplies daily fallback stats
  fetchTasks.push(withCache("current", loc, () => fetchCurrent(loc))
    .then(r => { om = r.value; if (r.cached) cached.push("current"); })
    .catch(e => errors.push("current: " + e.message)));
  if (wantOwm) fetchTasks.push(fetchOpenWeatherMap(loc).then(x => owm = x).catch(() => {}));
  if (preferredModel === "openweathermap") fetchTasks.push(fetchOwmForecast(loc).then(x => owmFc = x).catch(() => {}));
  if (wantObs) fetchTasks.push(withCache("obs", loc, () => fetchObservation(loc))
    .then(r => { obs = r.value; if (r.cached) cached.push("metar"); })
    .catch(() => {}));
  // 60-minute rain nowcast (Tomorrow.io) for the radar card's outlook line
  fetchTasks.push(fetchNowcast(loc).then(x => nowc = x).catch(() => {}));
  fetchTasks.push(fetchMetForecast(loc).then(x => rows = x).catch(e => errors.push("forecast: " + e.message)));
  jget("https://api.data.gov.my/weather/warning?limit=50", {}, 12000)
    .then(x => warns = pickWarnings(x, loc.region)).catch(() => {});
  await Promise.all(fetchTasks);

  fetchHaze(loc).then(hz => renderHaze(hz)).catch(() => renderHaze(null));
  /* A fresh airport observation outranks the model for "now": the model's
     point value is often 2-3 C cold and invents drizzle the METAR denies.
     110 min covers stations that report hourly plus the publication lag; the
     previous report is still far better ground truth than a wrong model value. */
  const obsFresh = !!(obs && (Date.now() - obs.time) < 110 * 60000);
  const preferObs = CONFIG.preferObservation !== false && preferredModel === "auto" && obsFresh;
  const cur = (!preferObs && useOm) ? om : null;   // OM wins only when no fresh observation
  renderNow(loc, cur, preferObs ? null : owm, obs, om);
  renderNowcast(nowc);
  // 7-day forecast + 12-hour strip follow the selected model where available
  const fcMode = preferredModel === "openmeteo" ? "om" : (preferredModel === "openweathermap" ? "owm" : "met");
  if (fcMode === "om" && om && om.daily && om.daily.time && om.daily.time.length) {
    renderOmDaily(om.daily);
    $("fcTitle").textContent = "Ramalan 7 hari";
    $("fcSrc").textContent = "Open-Meteo · ramalan model";
  } else if (fcMode === "owm" && owmFc && owmFc.length) {
    renderOwmDaily(owmFc);
    $("fcTitle").textContent = "Ramalan 5 hari";
    $("fcSrc").textContent = "OpenWeatherMap · model 5 hari";
  } else {
    if (rows.length) {
      renderForecast(rows);
      $("fcSrc").textContent = fcStale ? "MET Malaysia · ramalan cache" : "MET Malaysia · ramalan daerah";
    } else if (om && om.daily && om.daily.time && om.daily.time.length) {
      // MET mirror gave nothing at all: the model's daily rows keep the strip
      // populated instead of leaving a hole in the lobby display.
      renderOmDaily(om.daily);
      $("fcSrc").textContent = "Open-Meteo · sandaran";
    } else {
      $("fcSrc").textContent = "MET Malaysia · ramalan daerah";
    }
    $("fcTitle").textContent = "Ramalan 7 hari";
  }
  if (preferredModel === "openweathermap" && owmFc && owmFc.length) renderOwmHourly(owmFc);
  else renderHourlyForecast(om && om.hourly);
  renderWarnings(warns);

  /* Status is three-state, never five: a lobby panel should not shout about
     one of five sources failing while the display is complete.
       ok          - every source answered
       ok · cache  - complete, but at least one source came from the cache
       ralat ...   - nothing rendered at all (only then is it a real fault) */
  const anyOk = !!(om || owm || obs || rows.length);
  let statusMsg;
  if (!anyOk) {
    const first = errors.length ? errors[0] : "";
    statusMsg = first.startsWith("location") ? "ralat lokasi"
      : (first ? "ralat" : "tiada data");
    if (first && !first.startsWith("location")) console.warn("[kiosk] all sources failed:", errors);
  } else {
    statusMsg = cached.length ? "ok · cache" : "ok";
  }
  $("srcBadge").textContent = cur ? "Open-Meteo"
    : (owm && !preferObs ? "OpenWeatherMap" : (obs ? "METAR " + obs.station : "tiada data"));
  $("locBadge").textContent = loc.locationId ? "ramalan: " + loc.name : "ramalan: —";
  const stampSrc = cur ? "OM " : (owm && !preferObs ? "OWM " : (obs ? "cerapan " : ""));
  const stampAt = cur ? cur.current.time : ((owm && !preferObs) ? owm.obsTime : (obs ? obs.time : Date.now()));
  $("updated").textContent = stampSrc + clockHM(stampAt) + " · "
    + "dikemas kini " + new Date().toLocaleTimeString("en-GB", { timeZone: TZ, hour: "2-digit", minute: "2-digit" });
  $("status").textContent = statusMsg;
  $("status").className = anyOk ? "ok" : "err";
  $("srcBadge").classList.toggle("stale", !anyOk);
  healthPing(anyOk);
  // Weather model selector button (cycles auto -> openmeteo -> openweathermap -> metar)
  const curIdx = MODEL_ORDER.indexOf(preferredModel);
  const nextModel = MODEL_ORDER[(curIdx + 1) % MODEL_ORDER.length];
  const modelBadge = $("modelBadge");
  modelBadge.textContent = "model: " + (MODEL_LABEL[preferredModel] || "auto");
  modelBadge.onclick = function () {
    try { localStorage.setItem("weatherModel", nextModel); } catch (e) { /* ignore */ }
    refresh();   // re-render in place — no page reload needed, much faster
  };

  if (anyOk) {
    lastGood = { loc, at: Date.now() };
    $("boot").classList.add("hide");
  }

  beacon({
    stage: "rendered",
    loc: { id: loc.locationId, name: loc.name, via: loc.via, km: loc.approxKm },
    current: cur ? {
      temp: cur.current.temperature_2m,
      code: cur.current.weather_code,
      hum: cur.current.relative_humidity_2m
    } : null,
    obs: obs ? { station: obs.id, temp: obs.temp, wx: obs.wx.join(" "), clouds: obs.clouds } : null,
    days: rows.length,
    firstDay: rows[0] || null,
    warnings: warns.length,
    cached: cached,
    status: statusMsg,
    errors
  });
}

setVh();
setResolution();
tickClock();
setInterval(tickClock, 1000);
window.addEventListener("resize", setVh);

let lastRefreshAt = 0;
async function safeRefresh() {
  try { await refresh(); } finally { lastRefreshAt = Date.now(); }
}

safeRefresh();
setInterval(safeRefresh, CONFIG.refreshMinutes * 60 * 1000);

// Re-check immediately when the screen wakes / tab becomes visible.
document.addEventListener("visibilitychange", () => { if (!document.hidden) safeRefresh(); });
setInterval(() => {
  if (!document.hidden && Date.now() - lastRefreshAt > CONFIG.refreshMinutes * 60 * 1000) safeRefresh();
}, 60000);

/* =====================================================================
   Kiosk housekeeping — keeps a 24/7 lobby panel healthy.
   ===================================================================== */
const NIGHT = CONFIG.nightDim || { from: "23:30", to: "06:30", level: 0.55 };
const BURNIN = CONFIG.burnIn || { drift: 2, blankHeader: true, blankAt: 45, blankSec: 30 };
let nightlyReloaded = null, blankedHour = -1;

function hmToMin(s) {
  const p = String(s).split(":");
  return (+p[0] || 0) * 60 + (+p[1] || 0);
}

/* Dim the panel overnight: less light spill in a closed lobby, and less
   backlight load on the panel. The overlay never intercepts input. */
function applyNightDim() {
  const el = $("dim");
  if (!el) return;
  const n = new Date();
  const now = n.getHours() * 60 + n.getMinutes();
  const a = hmToMin(NIGHT.from), b = hmToMin(NIGHT.to);
  const on = NIGHT.from === NIGHT.to ? false
    : (a <= b ? (now >= a && now < b) : (now >= a || now < b));
  el.style.opacity = on ? String(NIGHT.level == null ? 0.55 : NIGHT.level) : "0";
}

/* Burn-in care: walk the whole layout through four small offsets. */
const DRIFT = BURNIN.drift == null ? 2 : BURNIN.drift;
const SHIFTS = [[0, 0], [DRIFT, 0], [DRIFT, DRIFT], [0, DRIFT]];
let shiftIdx = 0;
function applyDrift() {
  const s = SHIFTS[shiftIdx++ % SHIFTS.length];
  const st = document.documentElement.style;
  st.setProperty("--shift-x", s[0] + "px");
  st.setProperty("--shift-y", s[1] + "px");
}

function blankHeader() {
  const app = $("app");
  if (!app) return;
  app.classList.add("hdr-off");
  setTimeout(function () { app.classList.remove("hdr-off"); },
             (BURNIN.blankSec == null ? 30 : BURNIN.blankSec) * 1000);
}

/* Heartbeat for the native shell: no beat for 4 min and it rebuilds the view. */
function beat() {
  try {
    if (window.AndroidInterface && typeof window.AndroidInterface.beat === "function") {
      window.AndroidInterface.beat();
    }
  } catch (e) { /* older APK without the bridge */ }
}

function ageText(ms) {
  const m = Math.floor(ms / 60000);
  return m < 60 ? m + " min" : Math.floor(m / 60) + " j " + (m % 60) + " m";
}

/* Amber past 20 min, red past 45. refresh() rewrites #status every cycle, so
   this only takes over once the data really is too old to trust. */
function paintStaleness() {
  const el = $("status"), badge = $("srcBadge");
  if (!el || !lastGood || !lastGood.at) return;
  const age = Date.now() - lastGood.at;
  if (age >= 45 * 60000) {
    el.textContent = "basi " + ageText(age);
    el.className = "err";
    if (badge) badge.classList.add("stale");
  } else if (age >= 20 * 60000) {
    el.textContent = "basi " + ageText(age);
    el.className = "aging";
  }
}

applyNightDim();
applyDrift();
beat();

/* Dead-man switch (optional, CONFIG.healthPing). At most one "alive" ping a day
   after a good cycle; after three empty cycles in a row, ping <url>/fail so an
   external check can alert you. Everything is best-effort. */
let badCycles = 0;
function healthPing(ok) {
  const url = CONFIG.healthPing;
  if (!url) return;
  badCycles = ok ? 0 : badCycles + 1;
  let last = 0;
  try { last = Number(localStorage.getItem("healthPingAt") || 0); } catch (e) { /* ignore */ }
  const now = Date.now();
  const due = ok ? (now - last > 24 * 3600e3) : badCycles === 3;
  if (!due) return;
  const target = ok ? url : String(url).replace(/\/$/, "") + "/fail";
  try {
    fetch(target, { mode: "no-cors", cache: "no-store" }).catch(function () {});
  } catch (e) { /* offline: the next cycle tries again */ }
  if (ok) {
    try { localStorage.setItem("healthPingAt", String(now)); } catch (e) { /* ignore */ }
  }
}

setInterval(function () {
  applyNightDim();
  paintStaleness();
  beat();
  // Drop a stale rain outlook: keeps the line through a transient upstream
  // failure, but never shows a 40-minute-old "hujan ±12 min lagi".
  if (nowcastAt && Date.now() - nowcastAt > 20 * 60000) {
    const n = $("radarNow");
    if (n) n.textContent = "";
    nowcastAt = 0;
  }
  const n = new Date();
  const hourKey = ymdTZ(n) + " " + n.getHours();
  // One short blank per hour, to rest the static header pixels.
  if (BURNIN.blankHeader && n.getMinutes() === (BURNIN.blankAt == null ? 45 : BURNIN.blankAt)
      && blankedHour !== hourKey) {
    blankedHour = hourKey;
    blankHeader();
  }
  // Reload once a night: clears WebView memory while the lobby is empty.
  if (n.getHours() === 4 && n.getMinutes() < 5 && nightlyReloaded !== hourKey) {
    nightlyReloaded = hourKey;
    location.reload();
  }
}, 30000);

setInterval(applyDrift, 30 * 60 * 1000);

// Android TV remote — expose a small "Home" button action.
// When clicked, request to exit the kiosk back to the Android home screen.
window.android = {
  requestExit: function() {
    // Try the AndroidInterface if the APK has it wired up; otherwise just close the tab.
    if (window.AndroidInterface && typeof window.AndroidInterface.requestExit === "function") {
      window.AndroidInterface.requestExit();
    } else {
      window.close();
    }
  }
};
</script>
</body>
</html>
